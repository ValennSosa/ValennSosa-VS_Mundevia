    <meta property="og:url" content="https://vs-mundevia.vercel.app/sorprendeme.html">
    <meta property="og:image" content="https://vs-mundevia.vercel.app/assets/brand/og-cover.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:locale" content="es_ES">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Sorpréndeme · VS Mundévia">
    <meta name="twitter:description" content="Dejá que el atlas elija un lugar inesperado para vos.">
    <meta name="twitter:image" content="https://vs-mundevia.vercel.app/assets/brand/og-cover.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./node_modules/aos/dist/aos.css">
    <link rel="stylesheet" href="./styles/style.css">
  </head>
  <body>
    <a class="u-skip-link" href="#contenido">Saltar al contenido</a>
    <div data-app-header></div>

    <main id="contenido" class="site-main page-shell">
      <header class="page-header u-container">
        <p class="page-header__eyebrow">Descubrimiento aleatorio</p>
        <h1 class="page-header__title">Sorpréndeme</h1>
        <p class="page-header__lead">
          Un destino al azar, con fotografía, datos esenciales y acceso a la ficha completa.
        </p>
      </header>

      <section class="section section--tight" aria-labelledby="surprise-title">
        <div class="u-container">
          <p class="surprise-status" data-surprise-status role="status">Buscando un destino…</p>
          <article class="surprise" data-surprise-stage hidden>
            <figure class="surprise__media">
              <img data-surprise-image alt="" width="1280" height="800">
              <figcaption class="surprise__credit" data-surprise-credit hidden></figcaption>
            </figure>
            <div class="surprise__copy">
              <p class="surprise__kicker" data-surprise-kicker></p>
              <h2 class="surprise__title" id="surprise-title" data-surprise-title></h2>
              <p class="surprise__meta" data-surprise-meta></p>
              <p class="surprise__text" data-surprise-text></p>
              <div class="surprise__actions">
                <button class="btn btn--primary" type="button" data-surprise-next>Otro destino</button>
                <a class="btn btn--ghost" data-surprise-link href="destino.html">Ver destino</a>
                <div data-surprise-save></div>
              </div>
            </div>
          </article>
          <div class="empty-state" data-surprise-fallback hidden>
            <h2 class="empty-state__title" data-surprise-fallback-title>No hay destinos para mostrar</h2>
            <p data-surprise-fallback-text></p>
            <a class="btn btn--primary" href="explorador.html">Ir al explorador</a>
          </div>
        </div>
      </section>
    </main>

    <div data-app-footer></div>

    <script src="./node_modules/aos/dist/aos.js"></script>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
