<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorador global · VS Mundévia</title>
    <meta name="description" content="Explorá el catálogo de VS Mundévia: filtrá por continente, país y categoría, y descubrí destinos destacados.">
    <meta property="og:title" content="Explorador global · VS Mundévia">
    <meta property="og:description" content="Catálogo filtrable y acceso accesible a destinos del mundo. El mapa Leaflet llega en una etapa posterior.">
    <meta property="og:type" content="website">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./node_modules/aos/dist/aos.css">
    <link rel="stylesheet" href="./styles/style.css">
  </head>
  <body>
    <a class="u-skip-link" href="#contenido">Saltar al contenido</a>
    <div data-app-header></div>

    <main id="contenido" class="site-main page-shell">
      <header class="page-header u-container">
        <p class="page-header__eyebrow">Explorador global</p>
        <h1 class="page-header__title">Catálogo del mundo</h1>
        <p class="page-header__lead">
          Filtrá por continente, país y categoría. El mapa Leaflet se incorporará más adelante; esta lista es la vía principal y accesible de exploración.
        </p>
      </header>

      <section class="section section--tight">
        <div class="u-container explorer-layout">
          <div class="explorer-toolbar">
            <div class="search-field" data-search-root>
              <label class="u-sr-only" for="explorer-search">Buscar destinos</label>
              <input
                id="explorer-search"
                class="form-control search-field__input"
                type="search"
                placeholder="Buscar por destino, ciudad, país, continente o etiqueta…"
                autocomplete="off"
                data-search-input
              >
              <button class="search-field__clear" type="button" data-search-clear hidden aria-label="Limpiar búsqueda">×</button>
              <ul id="explorer-suggestions" class="search-suggest" role="listbox" data-search-suggestions hidden></ul>
            </div>

            <div class="filter-bar" aria-label="Filtros de exploración">
              <label class="filter-bar__field">
                <span class="filter-bar__label">Continente</span>
                <select class="form-select" data-filter-continent></select>
              </label>
              <label class="filter-bar__field">
                <span class="filter-bar__label">País</span>
                <select class="form-select" data-filter-country></select>
              </label>
              <label class="filter-bar__field">
                <span class="filter-bar__label">Categoría</span>
                <select class="form-select" data-filter-category></select>
              </label>
              <button class="btn btn--ghost" type="button" data-filters-clear>Limpiar filtros</button>
            </div>

            <p class="explorer-status" data-explorer-status aria-live="polite">Cargando catálogo…</p>
          </div>

          <div class="map map--deferred" data-map role="region" aria-label="Mapa interactivo (próxima etapa)"></div>

          <div class="explorer-list" data-explorer-list aria-live="polite"></div>
        </div>
      </section>
    </main>

    <div data-app-footer></div>

    <script src="./node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./node_modules/aos/dist/aos.js"></script>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
