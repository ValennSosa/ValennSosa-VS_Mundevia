<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparar destinos · VS Mundévia</title>
    <meta name="description" content="Compará de dos a tres destinos de VS Mundévia: lugar, categoría, descripción y coordenadas.">
    <meta property="og:title" content="Comparar destinos · VS Mundévia">
    <meta property="og:description" content="Elegí hasta tres lugares y compará sus datos en paralelo.">
    <meta property="og:type" content="website">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./node_modules/aos/dist/aos.css">
    <link rel="stylesheet" href="./styles/style.css">
  </head>
  <body>
    <a class="u-skip-link" href="#contenido">Saltar al contenido</a>
    <div data-app-header></div>

    <main id="contenido" class="site-main page-shell">
      <header class="page-header u-container">
        <p class="page-header__eyebrow">Comparador</p>
        <h1 class="page-header__title">Comparar destinos</h1>
        <p class="page-header__lead" data-compare-status aria-live="polite">
          Buscá por nombre o país y elegí de dos a tres destinos.
        </p>
      </header>

      <section class="section section--tight">
        <div class="u-container compare">
          <div class="compare-picker">
            <h2 class="compare-picker__title">Elegir destinos</h2>
            <div class="search-field" data-search-root>
              <label class="u-sr-only" for="compare-query">Buscar destino por nombre o país</label>
              <input
                id="compare-query"
                class="form-control search-field__input"
                type="search"
                placeholder="Nombre o país"
                autocomplete="off"
                data-search-input
              >
              <button class="search-field__clear" type="button" data-search-clear hidden aria-label="Limpiar búsqueda">×</button>
              <ul id="compare-suggestions" class="search-suggest" role="listbox" data-search-suggestions hidden></ul>
            </div>
          </div>

          <div data-compare-selection></div>

          <div class="compare-actions">
            <button class="btn btn--primary" type="button" data-compare-confirm disabled>Comparar</button>
            <button class="btn btn--ghost" type="button" data-compare-clear disabled>Limpiar</button>
          </div>

          <div data-compare-board hidden></div>
        </div>
      </section>
    </main>

    <div data-app-footer></div>

    <script src="./node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./node_modules/aos/dist/aos.js"></script>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
