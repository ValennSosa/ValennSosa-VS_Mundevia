<!DOCTYPE html>
<html lang="es">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favoritos · VS Mundévia</title>
    <meta name="description" content="Tus destinos guardados en VS Mundévia. Persistencia local con localStorage.">

    <meta property="og:description" content="Consultá y gestioná los destinos que marcaste como favoritos.">
    <meta property="og:type" content="website">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        <div class="u-container" data-favorites-list></div>

    <div data-app-footer></div>

    <script src="./node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
